[package]
name = "snapescape-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "snapescape"
path = "src/main.rs"

[dependencies]
snapescape-core = { path = "../crates/snapescape-core" }
snapescape-dns = { path = "../crates/snapescape-dns" }
snapescape-scanner = { path = "../crates/snapescape-scanner" }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
