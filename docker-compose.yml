services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snapescape
      POSTGRES_USER: snapescape
      POSTGRES_PASSWORD: snapescape_dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  api:
    build:
      context: ./services/python-api
      dockerfile: ../../deploy/docker/Dockerfile.api
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_URL: postgresql://snapescape:snapescape_dev@postgres:5432/snapescape
      SNAPESCAPE_VAULT_KEY: ${SNAPESCAPE_VAULT_KEY:-dev-vault-key-change-in-production}
    depends_on: [redis, postgres, mongo]
    volumes: [./data:/app/data, ./config:/app/config, ./plugins:/app/plugins]

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis, api]
    deploy:
      replicas: 2

  browser-engine:
    build:
      context: ./services/browser-engine
      dockerfile: ../../deploy/docker/Dockerfile.browser
    ports: ["3001:3001"]

  puppeteer-engine:
    build:
      context: ./services/puppeteer-engine
      dockerfile: ../../deploy/docker/Dockerfile.puppeteer
    ports: ["3002:3002"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../deploy/docker/Dockerfile.dashboard
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]

volumes:
  redis_data:
  postgres_data:
  mongo_data:
