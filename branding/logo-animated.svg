  <polygon points="256,30 470,140 470,360 256,470 42,360 42,140" fill="#0a0a12" stroke="url(#g)" stroke-width="5" filter="url(#gl)">
    <animate attributeName="stroke-width" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <text x="256" y="290" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="url(#g)">SS</text>
  <text x="256" y="420" text-anchor="middle" font-family="monospace" font-size="22" fill="url(#g)">SNAPESCAPE</text>
