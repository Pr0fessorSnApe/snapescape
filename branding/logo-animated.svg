<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#7b2fff;#ff0055;#00f0ff" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ff0055"><animate attributeName="stop-color" values="#ff0055;#00f0ff;#7b2fff;#ff0055" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
