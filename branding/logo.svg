  <polygon points="256,40 460,140 460,340 256,440 52,340 52,140" stroke="url(#neonBlue)" stroke-width="6" fill="#0a0a12" filter="url(#glow)"/>
  <path d="M256 100 L340 200 L300 200 L300 320 L212 320 L212 200 L172 200 Z" fill="url(#neonBlue)" opacity="0.9"/>
  <circle cx="256" cy="256" r="12" fill="#00f0ff">
