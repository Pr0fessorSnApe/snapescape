apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapescape-api
  labels:
    app: snapescape-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snapescape-api
  template:
    metadata:
      labels:
        app: snapescape-api
    spec:
      containers:
        - name: api
          image: snapescape/api:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://snapescape-redis:6379/0
            - name: MONGODB_URL
              value: mongodb://snapescape-mongo:27017
            - name: SNAPESCAPE_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: snapescape-secrets
                  key: vault-key
---
apiVersion: v1
kind: Service
metadata:
  name: snapescape-api
spec:
  selector:
    app: snapescape-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapescape-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snapescape-worker
  template:
    metadata:
      labels:
        app: snapescape-worker
    spec:
      containers:
        - name: worker
          image: snapescape/worker:1.0.0
          env:
            - name: REDIS_URL
              value: redis://snapescape-redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapescape-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snapescape-dashboard
  template:
    metadata:
      labels:
        app: snapescape-dashboard
    spec:
      containers:
        - name: dashboard
          image: snapescape/dashboard:1.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: snapescape-dashboard
spec:
  type: LoadBalancer
  selector:
    app: snapescape-dashboard
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snapescape-redis
spec:
  serviceName: snapescape-redis
  replicas: 1
  selector:
    matchLabels:
      app: snapescape-redis
  template:
    metadata:
      labels:
        app: snapescape-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snapescape-mongo
spec:
  serviceName: snapescape-mongo
  replicas: 1
  selector:
    matchLabels:
      app: snapescape-mongo
  template:
    metadata:
      labels:
        app: snapescape-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snapescape-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snapescape-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
